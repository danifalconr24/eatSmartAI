quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.limits.max-body-size=15M

openrouter.api.key=${OPENROUTER_API_KEY:}
# Ordered fallback list; all entries must accept image input (check
# https://openrouter.ai/models?modalities=image before changing).
openrouter.models=google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,minimax/minimax-m3:free
quarkus.rest-client.openrouter.url=https://openrouter.ai/api/v1
quarkus.rest-client.openrouter.connect-timeout=10000
quarkus.rest-client.openrouter.read-timeout=30000

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
quarkus.rest-client.gemini.url=https://generativelanguage.googleapis.com
quarkus.rest-client.gemini.connect-timeout=10000
quarkus.rest-client.gemini.read-timeout=30000

quarkus.log.level=INFO
quarkus.log.category."com.eatsmart".level=INFO
