quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.limits.max-body-size=15M

openrouter.api.key=${OPENROUTER_API_KEY:fake-key}
# Ordered fallback list; all entries must accept image input (check
# https://openrouter.ai/models?modalities=image before changing).
openrouter.models=google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,minimax/minimax-m3:free
quarkus.rest-client.openrouter.url=https://openrouter.ai/api/v1
quarkus.rest-client.openrouter.connect-timeout=10000
quarkus.rest-client.openrouter.read-timeout=30000

gemini.api.key=${GEMINI_API_KEY:fake-key}
gemini.model=gemini-3.6-flash
quarkus.rest-client.gemini.url=https://generativelanguage.googleapis.com
quarkus.rest-client.gemini.connect-timeout=10000
quarkus.rest-client.gemini.read-timeout=30000

quarkus.log.level=INFO
quarkus.log.category."com.eatsmart".level=INFO

# Access log: method, path, status, bytes, duration (ms). Enabled in prod only.
%prod.quarkus.http.access-log.enabled=true
%prod.quarkus.http.access-log.pattern=%{REMOTE_HOST} %{METHOD} %{REQUEST_PATH} %{RESPONSE_CODE} %b %{RESPONSE_TIME} ms

# Console: human-readable in dev, structured JSON in prod (one object per
# line, ready for Loki/ELK/CloudWatch ingestion from stdout).
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n
quarkus.console.color=true
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
%prod.quarkus.console.color=false
