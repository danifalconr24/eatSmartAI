name: Backend validate, build and deploy

on:
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package application
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload Quarkus app artifact
        uses: actions/upload-artifact@v5
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Quarkus app artifact
        uses: actions/download-artifact@v5
        with:
          name: quarkus-app
          path: backend/target/quarkus-app/

      - name: Copy backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy backend service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            docker compose up -d --build backend
            docker system prune -f

      - name: Health check
        run: |
          sleep 5
          echo "Checking ${{ secrets.VPS_HEALTH_URL }}"
          HTTP_CODE=$(curl -sS -o /tmp/health_body -w "%{http_code}" \
            --retry 10 --retry-delay 5 --retry-all-errors \
            "${{ secrets.VPS_HEALTH_URL }}")
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/health_body
          test "$HTTP_CODE" = "200"
